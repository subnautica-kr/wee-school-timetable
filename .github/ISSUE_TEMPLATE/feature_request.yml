name: ✨ 기능 제안 (Feature request)
description: 있었으면 하는 기능을 제안해 주세요
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 어려움이 있나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
