services:
  - type: web
    name: wee-school-timetable
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:web
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: wee-school-timetable-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true

databases:
  - name: wee-school-timetable-db
    plan: free
